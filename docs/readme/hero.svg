<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="elevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#ced0d4"/>

  <!-- left: name and promise -->
  <g transform="translate(72 0)">
    <rect y="72" width="268" height="30" rx="15" fill="#e7f3ff"/>
    <circle cx="18" cy="87" r="5" fill="#0866ff"/>
    <text x="32" y="92" font-size="14" font-weight="600" fill="#0064d1" letter-spacing="0.6">A FACEBOOK EVENTS FEATURE</text>

    <text y="180" font-size="76" font-weight="800" fill="#050505" letter-spacing="-2.5">Queue Up</text>
    <text y="226" font-size="24" fill="#4b4c4f">Go to events with a squad, not alone.</text>
    <text y="268" font-size="18" fill="#65676b">AI Companions powered by Muse match you into a squad</text>
    <text y="294" font-size="18" fill="#65676b">for Facebook Events and plan the hangout.</text>

    <rect y="326" width="232" height="44" rx="6" fill="#0866ff"/>
    <text x="116" y="354" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Find a squad to go with</text>
    <rect x="246" y="326" width="140" height="44" rx="6" fill="#e4e6eb"/>
    <text x="316" y="354" font-size="16" font-weight="600" fill="#050505" text-anchor="middle">Interested</text>
  </g>

  <!-- right: the one loud moment -->
  <g transform="translate(770 46)" filter="url(#elevated)">
    <rect width="436" height="328" rx="12" fill="#ffffff"/>
  </g>
  <g transform="translate(770 46)">
    <rect width="436" height="34" rx="12" fill="#f0f2f5"/>
    <rect y="22" width="436" height="12" fill="#f0f2f5"/>
    <text x="218" y="23" font-size="12" fill="#65676b" text-anchor="middle">Hackathon prototype, not Facebook</text>

    <circle cx="218" cy="92" r="36" fill="#0866ff"/>
    <path d="M202 92l11 11 21-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="218" y="160" font-size="26" font-weight="800" fill="#050505" text-anchor="middle" letter-spacing="-0.5">Your squad is ready</text>
    <text x="218" y="186" font-size="14" fill="#65676b" text-anchor="middle">5 people going to Indie Night together</text>

    <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="98" cy="232" r="25" fill="#1b74e4"/><text x="98" y="238">JL</text>
      <circle cx="158" cy="232" r="25" fill="#45bd62"/><text x="158" y="238">RA</text>
      <circle cx="218" cy="232" r="25" fill="#7a3fe4"/><text x="218" y="238">YD</text>
      <circle cx="278" cy="232" r="25" fill="#e41e3f"/><text x="278" y="238">RC</text>
      <circle cx="338" cy="232" r="25" fill="#f7b928"/><text x="338" y="238">BP</text>
    </g>
    <g font-size="12" fill="#050505" text-anchor="middle">
      <text x="98" y="274">You</text><text x="158" y="274">Reza</text><text x="218" y="274">Yuki</text><text x="278" y="274">Rosa</text><text x="338" y="274">Ben</text>
    </g>

    <rect x="24" y="290" width="388" height="1" fill="#ced0d4"/>
    <text x="24" y="315" font-size="12" font-weight="700" fill="#f3425f" letter-spacing="0.3">SAT AT 7:30 PM</text>
    <text x="134" y="315" font-size="13" font-weight="600" fill="#050505">Indie Night · The Guild Theatre</text>
  </g>
</svg>
